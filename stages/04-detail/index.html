<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>단계 4. 상세</title>
    <link rel="stylesheet" href="../stage.css">

<body>
    <header class="stage-banner">
        <h1>단계 4. 상세</h1>
        <p>입구 화면의 조회와 검색이 된 뒤에 다음 화면을 만든다. 제목은 fetchDetail로 가고, 목록 버튼은 입구로 돌아온다.</p>
        <p>정한 함수: App.showDetail. 추가한 명령은 open, back. 등록과 수정은 아직 없다.</p>
        <p class="files">파일: js/app.js, js/view.js</p>

    <div id="board">게시판을 불러오는 중입니다.</div>
    <script src="./js/loader.js"></script>
    <script>
        require(["DS/ENXBoard/js/app"], function (App) {
            new App(document.getElementById("board")).init();
        });
    </script>
