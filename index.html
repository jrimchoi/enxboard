<!DOCTYPE html>
<!--
  ENXBoard 진입 문서. 빌드 없이 브라우저가 이 파일부터 읽는다.
  화면 런타임은 AMD define/require다. React의 가상 DOM, Vue의 반응성, Next의 컴파일 단계가 없다.
  js/loader.js가 DS/ENXBoard/* 를 이 폴더의 js/*.js로 바꾼 뒤 App을 만든다.
  아이콘 CSS와 글꼴은 이 저장소의 vendor/core에 있다. StackBlitz와 로컬 모두 이 폴더가 서버 루트다.
  이 문서는 위젯 메시지 큐를 만들지 않는다. js/app.js가 대시보드 widget을 구독하지 않기 때문이다.
  세 이식 앱의 index.html 또는 pages/_document.js에는 __enxTakeWidgetQueue가 있다.
-->
<html lang="ko">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>ENXBoard</title>
    <link rel="stylesheet" href="./vendor/core/wux-3ds-fonticons.css">
    <link rel="stylesheet" href="./css/board.css">
</head>
<body>
    <div id="board">게시판을 불러오는 중입니다.</div>
    <script src="./js/loader.js"></script>
    <script>
        require(["DS/ENXBoard/js/app"], function (App) {
            var root = document.getElementById("board");
            if (root) {
                new App(root).init();
            }
        });
    </script>
</body>
</html>
